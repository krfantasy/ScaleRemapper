name: Release

on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]
    branches: [master]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the CI commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (with project-page base path)
        # --base=/ScaleRemapper/ is required because GitHub serves this
        # project page at https://krfantasy.github.io/ScaleRemapper/,
        # not the domain root. vite.config.ts stays untouched.
        run: npm run build -- --base=/ScaleRemapper/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          enable_jekyll: false
